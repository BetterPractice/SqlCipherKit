name: CI

on:
  # Every branch push runs CI, so a commit is verified before main is
  # fast-forwarded to it (main's ruleset requires these checks to pass).
  push:
    branches: ["**"]
  # Pull requests from forks don't push to this repository, so they still
  # need their own trigger.
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ───────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      # Keep in step with the version contributors run locally.
      SWIFTFORMAT_VERSION: "0.64.6"
    steps:
      - uses: actions/checkout@v6

      # The official release binary is statically linked, so no Swift
      # toolchain is needed.
      - name: Install SwiftFormat ${{ env.SWIFTFORMAT_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip"
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          mv "$RUNNER_TEMP/swiftformat/swiftformat_linux" "$RUNNER_TEMP/swiftformat/swiftformat"
          chmod +x "$RUNNER_TEMP/swiftformat/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"

      - name: SwiftFormat
        run: |
          swiftformat --version
          swiftformat --lint .

  # ── macOS ──────────────────────────────────────────────────────────────────
  test-macos:
    name: Test · macOS (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: "26.3"   # Swift 6.2: oldest supported; its iOS 26.2 simulator runtime is preinstalled
          - runner: xcode-27  # macOS 27 image (public preview)
            xcode: "27.1"   # Swift 6.4
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Build and test
        run: |
          swift --version
          swift test --configuration debug --enable-code-coverage

      # Paths come from SwiftPM: the test bundle's name and the build
      # directory layout differ between toolchains (Swift 6.4 names the
      # bundle after the test target and builds under .build/out).
      - name: Coverage report
        run: |
          BIN_DIR="$(swift build --show-bin-path)"
          BUNDLE="$(find "$BIN_DIR" -maxdepth 1 -name '*.xctest' | head -n 1)"
          [ -n "$BUNDLE" ] || { echo "No .xctest bundle in $BIN_DIR"; ls "$BIN_DIR"; exit 1; }
          PROFDATA="$(dirname "$(swift test --show-codecov-path)")/default.profdata"
          xcrun llvm-cov report \
            "$BUNDLE/Contents/MacOS/$(basename "$BUNDLE" .xctest)" \
            -instr-profile "$PROFDATA" \
            --ignore-filename-regex=".build|CSqlCipher" \
            --summary-only

      # Runners on the same image do not always have the iOS platform installed
      # for older, non-default Xcode versions; xcodebuild then lists the iOS
      # destination with "error:iOS <version> is not installed".  Download it
      # only in that case, so provisioned runners pay nothing.
      - name: Ensure the iOS platform is installed
        run: |
          if xcodebuild -showdestinations -scheme SqlCipherKit 2>/dev/null \
              | grep "platform:iOS," | grep -q "error:"; then
            echo "iOS platform missing for Xcode ${{ matrix.xcode }}; downloading"
            xcodebuild -downloadPlatform iOS -architectureVariant arm64
          else
            echo "iOS platform already installed"
          fi

      # pipefail makes the step fail when xcodebuild does, not just xcpretty.
      - name: Build for iOS (deployment target check)
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme SqlCipherKit \
            -destination 'generic/platform=iOS' \
            SWIFT_STRICT_CONCURRENCY=complete \
            | xcpretty

  # ── Linux ──────────────────────────────────────────────────────────────────
  test-linux:
    name: Test · Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift:
          - "6.2"   # Oldest supported: matches swift-tools-version in Package.swift
          - "6.4"   # Newest release
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v6

      - name: Install libssl-dev
        run: apt-get update -q && apt-get install -y libssl-dev

      - name: Build and test
        run: |
          swift --version
          swift test --configuration debug --enable-code-coverage

      # See the macOS coverage step.  Before Swift 6.4 the tests build to an
      # executable `.xctest`; from 6.4 to a `<Target>.so` loaded by a separate
      # test runner.  Either one holds the coverage mapping.
      - name: Coverage report
        run: |
          BIN_DIR="$(swift build --show-bin-path)"
          TESTS="$(find "$BIN_DIR" -maxdepth 1 \( -name '*.xctest' -o -name '*Tests.so' \) | head -n 1)"
          [ -n "$TESTS" ] || { echo "No test binary in $BIN_DIR"; ls "$BIN_DIR"; exit 1; }
          PROFDATA="$(dirname "$(swift test --show-codecov-path)")/default.profdata"
          llvm-cov report \
            "$TESTS" \
            -instr-profile "$PROFDATA" \
            --ignore-filename-regex=".build|CSqlCipher" \
            --summary-only
